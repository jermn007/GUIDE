<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-label="GUIDE's ten archetypes placed on the five ADDIE phases, with Curriculum Alignment spanning all of them">
  <title>Ten archetypes across the five ADDIE phases</title>
  <rect x="1" y="1" width="918" height="638" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <!-- Title -->
    <text x="460" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Ten Archetypes Across ADDIE</text>
    <text x="460" y="82" text-anchor="middle" font-size="16" fill="#475569">Each archetype belongs to one phase. Archetype 10 checks that the phases agree.</text>

    <!-- Phase headers -->
    <g font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
      <rect x="52" y="118" width="152" height="46" rx="8" fill="#334155"/>
      <text x="128" y="147">Analyze</text>
      <rect x="218" y="118" width="152" height="46" rx="8" fill="#334155"/>
      <text x="294" y="147">Design</text>
      <rect x="384" y="118" width="152" height="46" rx="8" fill="#334155"/>
      <text x="460" y="147">Develop</text>
      <rect x="550" y="118" width="152" height="46" rx="8" fill="#334155"/>
      <text x="626" y="147">Implement</text>
      <rect x="716" y="118" width="152" height="46" rx="8" fill="#334155"/>
      <text x="792" y="147">Evaluate</text>
    </g>

    <!-- Arrows between phases -->
    <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M207 141 l8 0 m-4 -4 l4 4 l-4 4"/>
      <path d="M373 141 l8 0 m-4 -4 l4 4 l-4 4"/>
      <path d="M539 141 l8 0 m-4 -4 l4 4 l-4 4"/>
      <path d="M705 141 l8 0 m-4 -4 l4 4 l-4 4"/>
    </g>

    <!-- Archetype chips -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="52" y="182" width="152" height="60" rx="8"/>
      <rect x="218" y="182" width="152" height="60" rx="8"/>
      <rect x="218" y="252" width="152" height="60" rx="8"/>
      <rect x="218" y="322" width="152" height="60" rx="8"/>
      <rect x="384" y="182" width="152" height="60" rx="8"/>
      <rect x="384" y="252" width="152" height="60" rx="8"/>
      <rect x="550" y="182" width="152" height="60" rx="8"/>
      <rect x="716" y="182" width="152" height="60" rx="8"/>
      <rect x="716" y="252" width="152" height="60" rx="8"/>
    </g>
    <g font-size="14" fill="#0f172a" text-anchor="middle">
      <text x="128" y="207"><tspan font-weight="700">07</tspan> Needs</text>
      <text x="128" y="226">Analysis</text>

      <text x="294" y="207"><tspan font-weight="700">03</tspan> Instructional</text>
      <text x="294" y="226">Sequencing</text>
      <text x="294" y="277"><tspan font-weight="700">08</tspan> Story</text>
      <text x="294" y="296">Design</text>
      <text x="294" y="347"><tspan font-weight="700">09</tspan> Cognitive</text>
      <text x="294" y="366">Neuroscience</text>

      <text x="460" y="207"><tspan font-weight="700">04</tspan> Multimedia</text>
      <text x="460" y="226">Design</text>
      <text x="460" y="287"><tspan font-weight="700">05</tspan> Accessibility</text>

      <text x="626" y="207"><tspan font-weight="700">01</tspan> Adult Learning</text>
      <text x="626" y="226">Communication</text>

      <text x="792" y="207"><tspan font-weight="700">02</tspan> Assessment</text>
      <text x="792" y="226">Design</text>
      <text x="792" y="277"><tspan font-weight="700">06</tspan> Formative</text>
      <text x="792" y="296">Evaluation</text>
    </g>

    <!-- Archetype 10 spans every phase -->
    <rect x="52" y="418" width="816" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="460" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">10 Curriculum Alignment - across all phases</text>
    <text x="460" y="478" text-anchor="middle" font-size="14.5" fill="#334155">Do the objectives, the instruction, and the assessment agree with each other?</text>
    <text x="460" y="498" text-anchor="middle" font-size="14.5" fill="#334155">A course can score well on every other archetype and still fail this one.</text>

    <!-- Bracket from phases to archetype 10 -->
    <g stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 5" fill="none">
      <path d="M128 244 V416"/>
      <path d="M294 384 V416"/>
      <path d="M460 314 V416"/>
      <path d="M626 244 V416"/>
      <path d="M792 314 V416"/>
    </g>

    <!-- Footer -->
    <text x="460" y="560" text-anchor="middle" font-size="14.5" fill="#334155">In design mode an archetype is a guardrail while you build. In evaluate mode it is the acceptance test.</text>
    <text x="460" y="622" text-anchor="middle" font-size="12" fill="#475569">ADDIE: Analyze, Design, Develop, Implement, Evaluate. Archetype numbers are identifiers, not an order of use.</text>
  </g>
</svg>

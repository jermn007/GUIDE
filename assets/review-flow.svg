<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-label="The five steps of a GUIDE review and the four verdict bands">
  <title>How a GUIDE review runs: five steps and four verdict bands</title>
  <rect x="1" y="1" width="918" height="638" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <!-- Title -->
    <text x="460" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">How a GUIDE Review Runs</text>
    <text x="460" y="82" text-anchor="middle" font-size="16" fill="#475569">Five steps from a draft to a verdict you can act on.</text>

    <!-- Step cards -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="52" y="120" width="152" height="188" rx="10"/>
      <rect x="218" y="120" width="152" height="188" rx="10"/>
      <rect x="384" y="120" width="152" height="188" rx="10"/>
      <rect x="550" y="120" width="152" height="188" rx="10"/>
      <rect x="716" y="120" width="152" height="188" rx="10"/>
    </g>

    <!-- Arrows between cards -->
    <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M207 214 l8 0 m-4 -4 l4 4 l-4 4"/>
      <path d="M373 214 l8 0 m-4 -4 l4 4 l-4 4"/>
      <path d="M539 214 l8 0 m-4 -4 l4 4 l-4 4"/>
      <path d="M705 214 l8 0 m-4 -4 l4 4 l-4 4"/>
    </g>

    <!-- Step numbers -->
    <g fill="#2563eb">
      <circle cx="128" cy="154" r="17"/>
      <circle cx="294" cy="154" r="17"/>
      <circle cx="460" cy="154" r="17"/>
      <circle cx="626" cy="154" r="17"/>
      <circle cx="792" cy="154" r="17"/>
    </g>
    <g font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="128" y="160">1</text>
      <text x="294" y="160">2</text>
      <text x="460" y="160">3</text>
      <text x="626" y="160">4</text>
      <text x="792" y="160">5</text>
    </g>

    <!-- Step titles -->
    <g font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">
      <text x="128" y="200">Route</text>
      <text x="294" y="200">Read</text>
      <text x="460" y="200">Score</text>
      <text x="626" y="200">Flag and fix</text>
      <text x="792" y="200">Verdict</text>
    </g>

    <!-- Step descriptions -->
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="128" y="228">Match the draft to</text>
      <text x="128" y="246">one to three</text>
      <text x="128" y="264">archetypes.</text>

      <text x="294" y="228">Read each rubric:</text>
      <text x="294" y="246">six dimensions,</text>
      <text x="294" y="264">anchors from 1 to 5.</text>

      <text x="460" y="228">Give each dimension</text>
      <text x="460" y="246">the score its anchor</text>
      <text x="460" y="264">matches, and quote</text>
      <text x="460" y="282">the evidence.</text>

      <text x="626" y="228">Raise severity flags.</text>
      <text x="626" y="246">Give a concrete fix</text>
      <text x="626" y="264">for every dimension</text>
      <text x="626" y="282">under 4.</text>

      <text x="792" y="228">Average the six</text>
      <text x="792" y="246">scores and read</text>
      <text x="792" y="264">the band below.</text>
    </g>

    <!-- Verdict bands, to scale from 1.0 to 5.0 (204 px per point) -->
    <text x="52" y="366" font-size="16" font-weight="700" fill="#0f172a">Verdict bands for the overall score</text>
    <g stroke="#475569" stroke-width="1.5">
      <rect x="52" y="386" width="306" height="70" fill="#fee2e2"/>
      <rect x="358" y="386" width="204" height="70" fill="#ffedd5"/>
      <rect x="562" y="386" width="204" height="70" fill="#fef9c3"/>
      <rect x="766" y="386" width="102" height="70" fill="#dcfce7"/>
    </g>
    <g font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
      <text x="205" y="418">Redesign</text>
      <text x="460" y="418">Revise</text>
      <text x="664" y="418">Light revision</text>
      <text x="817" y="418">Ship</text>
    </g>
    <g font-size="12.5" fill="#334155" text-anchor="middle">
      <text x="205" y="440">Do not ship.</text>
      <text x="460" y="440">Fix before wide rollout.</text>
      <text x="664" y="440">Ship with gaps noted.</text>
      <text x="817" y="440">As is.</text>
    </g>
    <!-- Scale ticks -->
    <g stroke="#475569" stroke-width="1.5">
      <path d="M52 456 v8"/>
      <path d="M358 456 v8"/>
      <path d="M562 456 v8"/>
      <path d="M766 456 v8"/>
      <path d="M868 456 v8"/>
    </g>
    <g font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">
      <text x="52" y="482">1.0</text>
      <text x="358" y="482">2.5</text>
      <text x="562" y="482">3.5</text>
      <text x="766" y="482">4.5</text>
      <text x="868" y="482">5.0</text>
    </g>

    <!-- Notes -->
    <text x="460" y="536" text-anchor="middle" font-size="14.5" fill="#334155">Each band starts at its lower number: 4.47 is light revision, not ship.</text>
    <text x="460" y="560" text-anchor="middle" font-size="14.5" fill="#334155">Two exceptions: 01 weights accuracy and adult learning alignment, and 10 can cap the overall at 3.0.</text>
    <text x="460" y="622" text-anchor="middle" font-size="12" fill="#475569">Design mode uses the same anchors the other way round: build to them, then score your own draft before delivering it.</text>
  </g>
</svg>

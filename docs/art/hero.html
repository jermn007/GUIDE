<!doctype html>
<!--
  GUIDE README hero. Original artwork, generated in code; licensed Apache-2.0
  with the rest of the repository.

  Render (from the repo root; bash):
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1280,400 --screenshot=docs/art/hero-light.png \
      "file://$PWD/docs/art/hero.html?theme=light"
    (repeat with theme=dark and hero-dark.png)

  The backgrounds are seeded, so every render is identical.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GUIDE hero</title>
<style>
  :root {
    --title: #0f172a;
    --subtitle: #334155;
    --shadow: none;
  }
  :root[data-theme="dark"] {
    --title: #f8fafc;
    --subtitle: #bfdbfe;
    --shadow: 0 2px 18px rgba(2, 6, 23, 0.6);
  }
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 400px; overflow: hidden; position: relative;
         font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
  svg.bg { position: absolute; inset: 0; display: block; }
  .card { position: absolute; top: 50px; left: 0; right: 0; text-align: center; }
  .mark { display: inline-flex; align-items: center; gap: 24px; }
  h1 { margin: 0; font-size: 114px; line-height: 1; font-weight: 800;
       letter-spacing: 0.06em; color: var(--title); text-shadow: var(--shadow); }
  p { margin: 20px 0 0; font-size: 30px; font-weight: 500; letter-spacing: 0.02em;
      color: var(--subtitle); text-shadow: var(--shadow); }
</style>
</head>
<body>
<svg class="bg" id="bg" width="1280" height="400" viewBox="0 0 1280 400" aria-hidden="true"></svg>
<div class="card">
  <div class="mark">
    <!-- Three alignments: effective (blue), efficient (green), engaging (amber) -->
    <svg width="92" height="84" viewBox="0 0 84 76" aria-hidden="true">
      <path d="M42 8 L76 68 L8 68 Z" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linejoin="round" style="color: var(--subtitle)"/>
      <circle cx="42" cy="8" r="7.5" fill="#2563eb"/>
      <circle cx="76" cy="68" r="7.5" fill="#059669"/>
      <circle cx="8" cy="68" r="7.5" fill="#d97706"/>
    </svg>
    <h1>GUIDE</h1>
  </div>
  <p>Grounded Universal Instructional Design Evaluator</p>
</div>
<script>
const W = 1280, H = 400;
const theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
document.documentElement.dataset.theme = theme;
const svg = document.getElementById("bg");
const NS = "http://www.w3.org/2000/svg";

// Small seeded PRNG (mulberry32) so renders are repeatable.
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function el(name, attrs, parent = svg) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function lerp(a, b, t) { return a + (b - a) * t; }
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function ramp(stops, t) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
      const u = (t - t0) / (t1 - t0), a = hex(c0), b = hex(c1);
      return a.map((v, j) => lerp(v, b[j], u));
    }
  }
  return hex(stops[stops.length - 1][1]);
}
function rgb(c, shift = 0) {
  return "rgb(" + c.map(v => Math.round(Math.min(255, Math.max(0, v + shift)))).join(",") + ")";
}

// Light theme: low-poly field, white at the top, deepening to navy at the bottom.
function lightBackground() {
  const r = rng(20260924);
  const cols = 26, rows = 10;
  const pts = [];
  for (let j = 0; j <= rows; j++) {
    pts.push([]);
    for (let i = 0; i <= cols; i++) {
      const edgeX = i === 0 || i === cols, edgeY = j === 0 || j === rows;
      const x = (i / cols) * W + (edgeX ? 0 : (r() - 0.5) * (W / cols) * 0.9);
      const y = (j / rows) * H + (edgeY ? 0 : (r() - 0.5) * (H / rows) * 0.9);
      pts[j].push([x, y]);
    }
  }
  const stops = [
    [0.00, "#ffffff"], [0.38, "#f4fafd"], [0.55, "#cfeaf7"],
    [0.70, "#7cc9ec"], [0.82, "#2fa6de"], [0.92, "#1d6fc0"], [1.00, "#1e3a8a"],
  ];
  const g = el("g", {});
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const a = pts[j][i], b = pts[j][i + 1], c = pts[j + 1][i + 1], d = pts[j + 1][i];
      const tris = r() < 0.5 ? [[a, b, c], [a, c, d]] : [[a, b, d], [b, c, d]];
      for (const t of tris) {
        const cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3;
        // Terrain line: the color ramp rises and falls gently across the width.
        const wave = 0.05 * Math.sin(cx / 190) + 0.03 * Math.sin(cx / 67 + 1.3);
        const depth = cy / H + wave + (r() - 0.5) * 0.05;
        const color = ramp(stops, depth);
        const shade = (r() - 0.5) * 16;
        el("polygon", {
          points: t.map(p => p.map(v => v.toFixed(1)).join(",")).join(" "),
          fill: rgb(color, shade), stroke: rgb(color, shade), "stroke-width": 0.6,
        }, g);
      }
    }
  }
}

// Dark theme: navy sky over a rolling hexagon mesh with glowing nodes.
function darkBackground() {
  const r = rng(381);
  const defs = el("defs", {});
  const sky = el("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0", "stop-color": "#020a3a" }, sky);
  el("stop", { offset: "0.55", "stop-color": "#041463" }, sky);
  el("stop", { offset: "1", "stop-color": "#010824" }, sky);
  const glow = el("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
  el("feGaussianBlur", { stdDeviation: 2.2 }, glow);
  const haze = el("filter", { id: "haze", x: "-20%", y: "-50%", width: "140%", height: "200%" }, defs);
  el("feGaussianBlur", { stdDeviation: 14 }, haze);
  el("rect", { width: W, height: H, fill: "url(#sky)" });

  // Soft band of light along the horizon.
  el("ellipse", { cx: W / 2, cy: 250, rx: 760, ry: 38, fill: "#1d74d8", opacity: 0.35, filter: "url(#haze)" });

  // Hex lattice on a ground plane, lifted by a wave, projected in perspective.
  const s = 26;                          // hex edge length in world units
  const cam = { y: 150, z: -140, f: 420, horizon: 212 };
  const waveY = (x, z) => 26 * Math.sin(x / 150 + z / 260) + 18 * Math.sin(z / 110 - x / 330);
  function project(x, z) {
    const y = waveY(x, z);
    const dz = z - cam.z;
    return [W / 2 + (x * cam.f) / dz, cam.horizon + ((cam.y - y) * cam.f) / dz, dz];
  }
  const edges = new Map(), nodes = new Map();
  const key = (x, z) => Math.round(x * 10) + ":" + Math.round(z * 10);
  const hw = Math.sqrt(3) * s;           // hex width (pointy-top)
  for (let row = 0; row < 70; row++) {
    for (let col = -60; col <= 60; col++) {
      const cx = col * hw + (row % 2 ? hw / 2 : 0);
      const cz = 30 + row * 1.5 * s;
      const corners = [];
      for (let k = 0; k < 6; k++) {
        const ang = Math.PI / 180 * (60 * k - 30);
        corners.push([cx + s * Math.cos(ang), cz + s * Math.sin(ang)]);
      }
      for (let k = 0; k < 6; k++) {
        const p = corners[k], q = corners[(k + 1) % 6];
        const ek = [key(...p), key(...q)].sort().join("|");
        if (!edges.has(ek)) edges.set(ek, [p, q]);
        nodes.set(key(...p), p);
      }
    }
  }
  const mesh = el("g", { "stroke-linecap": "round" });
  const fade = dz => Math.max(0, Math.min(1, 1.25 - dz / 1900));
  for (const [p, q] of edges.values()) {
    const a = project(...p), b = project(...q);
    if (a[2] < 60 || b[2] < 60) continue;
    if ((a[0] < -40 && b[0] < -40) || (a[0] > W + 40 && b[0] > W + 40)) continue;
    const o = fade((a[2] + b[2]) / 2);
    if (o <= 0.02) continue;
    el("line", {
      x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1),
      stroke: "#38bdf8", "stroke-opacity": (0.55 * o).toFixed(3),
      "stroke-width": Math.max(0.4, 260 / a[2]).toFixed(2),
    }, mesh);
  }
  const lights = el("g", { fill: "#7dd3fc" });
  for (const p of nodes.values()) {
    const a = project(...p);
    if (a[2] < 60 || a[0] < -10 || a[0] > W + 10 || a[1] > H + 10) continue;
    const o = fade(a[2]);
    if (o <= 0.05) continue;
    el("circle", { cx: a[0].toFixed(1), cy: a[1].toFixed(1),
                   r: Math.max(0.6, 520 / a[2]).toFixed(2), opacity: (0.9 * o).toFixed(3) }, lights);
  }

  // Drifting particles above the mesh, a few of them soft and out of focus.
  const dust = el("g", { fill: "#67e8f9" });
  for (let i = 0; i < 90; i++) {
    const x = r() * W, y = 150 + r() * 140, big = r() < 0.18;
    if (x > 270 && x < 1010 && y < 235) continue;   // keep the title and subtitle clear
    el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: big ? (3 + r() * 5).toFixed(1) : (0.8 + r() * 1.6).toFixed(1),
                   opacity: big ? 0.18 : (0.35 + r() * 0.55).toFixed(2),
                   filter: big ? "url(#glow)" : "" }, dust);
  }
}

theme === "dark" ? darkBackground() : lightBackground();
</script>
</body>
</html>
